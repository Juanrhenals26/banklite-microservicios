<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<title>Comunicacion sincrona y asincrona entre Identity Service y Account Service</title>
<desc>Account Service llama a Identity Service por REST de forma sincrona para validar al usuario, mientras que Identity Service publica el evento identity.verified en RabbitMQ que Account Service consume de forma asincrona. Cada servicio tiene su propia base de datos.</desc>
<rect width="680" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="400" y1="68" x2="284" y2="68" stroke="#5f5e5a" stroke-width="1" marker-end="url(#arrow)"/>
<text x="340" y="56" text-anchor="middle" font-size="12" fill="#444441">REST síncrono</text>
<text x="340" y="88" text-anchor="middle" font-size="12" fill="#444441">GET /users/{id}</text>

<line x1="115" y1="96" x2="115" y2="132" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="565" y1="96" x2="565" y2="132" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<line x1="250" y1="96" x2="288" y2="266" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="390" y1="270" x2="429" y2="100" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="150" y="214" text-anchor="middle" font-size="12" fill="#444441">publica identity.verified</text>
<text x="532" y="214" text-anchor="middle" font-size="12" fill="#444441">consume el evento</text>

<g>
<rect x="40" y="40" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="160" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">identity-service</text>
<text x="160" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Puerto 8001 — usuarios y KYC</text>
</g>

<g>
<rect x="400" y="40" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="520" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">account-service</text>
<text x="520" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">Puerto 8002 — cuentas</text>
</g>

<g>
<rect x="40" y="132" width="150" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="115" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">identity_db</text>
<text x="115" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">PostgreSQL</text>
</g>

<g>
<rect x="490" y="132" width="150" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="565" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">account_db</text>
<text x="565" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">PostgreSQL</text>
</g>

<g>
<rect x="240" y="270" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="288" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">RabbitMQ</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">banklite.events</text>
</g>

<text x="340" y="366" text-anchor="middle" font-size="12" fill="#444441">Línea continua = REST síncrono · Línea punteada = evento asíncrono</text>
</svg>
