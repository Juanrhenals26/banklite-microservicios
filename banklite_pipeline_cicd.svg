<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<title>Pipeline de CI/CD de BankLite</title>
<desc>Flujo secuencial en GitHub Actions: desde el push hasta el despliegue en producción, pasando por pruebas, escaneo de seguridad, staging y aprobación manual.</desc>
<rect width="680" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="340" y1="64" x2="340" y2="100" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="156" x2="340" y2="192" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="248" x2="340" y2="284" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="340" y2="364" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="420" x2="340" y2="456" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Push / pull request</text>
</g>

<g>
<rect x="190" y="100" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">Lint + pruebas</text>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Unitarias e integración</text>
</g>

<g>
<rect x="190" y="192" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">Escaneo de seguridad</text>
<text x="340" y="230" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Dependencias, secretos, CodeQL</text>
</g>

<g>
<rect x="190" y="284" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="306" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Deploy automático a staging</text>
</g>

<g>
<rect x="190" y="364" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="382" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#412402">Aprobación manual</text>
<text x="340" y="402" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#633806">Obligatoria para producción</text>
</g>

<g>
<rect x="190" y="456" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="478" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#04342C">Deploy a producción + smoke tests</text>
</g>
</svg>
