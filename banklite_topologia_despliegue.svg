<svg width="680" height="448" viewBox="0 0 680 448" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<title>Topología de despliegue de BankLite</title>
<desc>Los usuarios acceden al panel web servido en Vercel, que consume el backend desplegado en Render dentro de una red privada con el Ledger DB cifrado en reposo, la cual se integra con procesadores externos certificados PCI-DSS.</desc>
<rect width="680" height="448" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="340" y1="64" x2="340" y2="100" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="156" x2="340" y2="196" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="312" x2="340" y2="352" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Usuarios</text>
</g>

<g>
<rect x="190" y="100" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#042C53">Vercel</text>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0C447C">Next.js (panel web)</text>
</g>

<rect x="40" y="196" width="600" height="116" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="60" y="218" font-size="14" font-weight="600" fill="#2C2C2A">Render — red privada</text>

<g>
<rect x="70" y="236" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="205" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Microservicios</text>
<text x="205" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Node/Django + JWT/MFA</text>
</g>
<g>
<rect x="350" y="236" width="270" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="485" y="254" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Ledger DB</text>
<text x="485" y="274" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Cifrado en reposo</text>
</g>

<g>
<rect x="180" y="352" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="370" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Procesadores externos</text>
<text x="340" y="390" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">KYC, tarjetas, banco (PCI-DSS)</text>
</g>
</svg>
