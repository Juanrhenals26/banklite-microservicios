<svg width="680" height="714" viewBox="0 0 680 714" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<title>Arquitectura de microservicios de BankLite</title>
<desc>Los clientes pasan por un API Gateway hacia un grupo de servicios síncronos (identidad, cuentas, ledger, transferencias, tarjetas), que publican eventos a RabbitMQ consumidos por servicios asíncronos (fraude, notificaciones, compliance).</desc>
<rect width="680" height="714" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="220" y1="76" x2="340" y2="130" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="460" y1="76" x2="340" y2="130" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="186" x2="340" y2="230" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="422" x2="340" y2="462" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="518" x2="340" y2="558" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>

