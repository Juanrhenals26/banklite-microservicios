# Blueprint de Render para desplegar los 6 microservicios de BankLite de una sola vez.
#
# Como usarlo:
# 1. Sube este archivo a la rama main de tu repo (ya viene incluido).
# 2. En https://dashboard.render.com haz clic en "New +" -> "Blueprint".
# 3. Conecta el repo "banklite-microservicios" y selecciona la rama main.
# 4. Render va a leer este archivo y va a proponer crear 1 base de datos y
#    6 servicios web. Dale a "Apply".
# 5. El primer despliegue tarda varios minutos (construye cada imagen Docker).
#
# Nota sobre la base de datos: el plan gratuito de Render solo permite UNA
# base de datos Postgres activa por cuenta (si el blueprint intenta crear 4,
# las 3 restantes fallan con "cannot have more than one active free tier
# database"). Por eso aqui usamos una sola instancia Postgres gratuita
# (banklite-db) compartida por los 4 microservicios. Esto es una limitacion
# de la cuenta gratuita de Render, no un cambio de arquitectura: cada
# microservicio sigue siendo dueno exclusivo de sus propias tablas (usuario,
# cuenta, transaccion, transferencia, etc. no se repiten entre servicios) y
# ningun servicio hace queries ni joins sobre las tablas de otro. Si mas
# adelante se sube a un plan de pago, basta con volver a separar esto en 4
# bloques "databases" (uno por servicio) y apuntar cada DATABASE_URL a la
# suya, sin tocar el codigo de los servicios.
#
# Nota sobre RabbitMQ: Render no ofrece RabbitMQ administrado gratis. Los 4
# microservicios ya estan probados para degradar de forma segura si no
# encuentran el broker (la operacion se completa igual, solo que el evento
# no se publica). Por eso este blueprint NO configura RabbitMQ: para la
# sustentacion, todo el flujo sincrono (REST) funciona igual en la nube. Si
# mas adelante quieres los eventos asincronos tambien en la nube, crea una
# instancia NUEVA y gratuita en cloudamqp.com (nunca reutilices una URL que
# ya haya quedado expuesta en un commit de Git) y agrega RABBITMQ_URL como
# variable de entorno desde el dashboard de Render (no la escribas aqui en
# el archivo, para que no quede en el historial del repositorio).

databases:
  - name: banklite-db
    databaseName: banklite
    user: banklite
    plan: free

services:
  - type: web
    name: banklite-identity-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/identity-service/Dockerfile
    dockerContext: ./services/identity-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: ENABLE_EVENTS
        value: "false"

  - type: web
    name: banklite-account-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/account-service/Dockerfile
    dockerContext: ./services/account-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: IDENTITY_SERVICE_URL
        value: https://banklite-identity-service.onrender.com
      - key: ENABLE_CONSUMER
        value: "false"

  - type: web
    name: banklite-ledger-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/ledger-service/Dockerfile
    dockerContext: ./services/ledger-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        value: https://banklite-account-service.onrender.com

  - type: web
    name: banklite-transfer-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/transfer-service/Dockerfile
    dockerContext: ./services/transfer-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        value: https://banklite-account-service.onrender.com
      - key: LEDGER_SERVICE_URL
        value: https://banklite-ledger-service.onrender.com
      - key: ENABLE_EVENTS
        value: "false"

  - type: web
    name: banklite-card-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/card-service/Dockerfile
    dockerContext: ./services/card-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        value: https://banklite-account-service.onrender.com
      - key: ENABLE_EVENTS
        value: "false"

  - type: web
    name: banklite-fraud-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/fraud-service/Dockerfile
    dockerContext: ./services/fraud-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: ENABLE_EVENTS
        value: "false"
      - key: ENABLE_CONSUMER
        value: "false"
