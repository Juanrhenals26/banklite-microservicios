# Blueprint de Render para desplegar los 4 microservicios de BankLite de una sola vez.
#
# Como usarlo:
# 1. Sube este archivo a la rama main de tu repo (ya viene incluido).
# 2. En https://dashboard.render.com haz clic en "New +" -> "Blueprint".
# 3. Conecta el repo "banklite-microservicios" y selecciona la rama main.
# 4. Render va a leer este archivo y va a proponer crear 4 bases de datos y
#    4 servicios web. Dale a "Apply".
# 5. El primer despliegue tarda varios minutos (construye cada imagen Docker).
#
# Por que 4 bases de datos separadas y no una sola compartida: el documento
# oficial del proyecto exige "database per service" (cada microservicio es
# dueno de su propia base de datos, sin bases compartidas ni joins entre
# microservicios). Usar una sola base para los 4 serviria para la demo, pero
# contradice la arquitectura que estamos sustentando.
#
# Nota sobre RabbitMQ: Render no ofrece RabbitMQ administrado gratis. Los 4
# microservicios ya estan probados para degradar de forma segura si no
# encuentran el broker (la operacion se completa igual, solo que el evento
# no se publica). Por eso este blueprint NO configura RabbitMQ: para la
# sustentacion, todo el flujo sincrono (REST) funciona igual en la nube. Si
# mas adelante quieres los eventos asincronos tambien en la nube, crea una
# instancia NUEVA y gratuita en cloudamqp.com (nunca reutilices una URL que
# ya haya quedado expuesta en un commit de Git) y agrega RABBITMQ_URL como
# variable de entorno desde el dashboard de Render (no la escribas aqui en
# el archivo, para que no quede en el historial del repositorio).

databases:
  - name: banklite-identity-db
    databaseName: identity_db
    user: banklite
    plan: free
  - name: banklite-account-db
    databaseName: account_db
    user: banklite
    plan: free
  - name: banklite-ledger-db
    databaseName: ledger_db
    user: banklite
    plan: free
  - name: banklite-transfer-db
    databaseName: transfer_db
    user: banklite
    plan: free

services:
  - type: web
    name: banklite-identity-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/identity-service/Dockerfile
    dockerContext: ./services/identity-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-identity-db
          property: connectionString
      - key: ENABLE_EVENTS
        value: "false"

  - type: web
    name: banklite-account-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/account-service/Dockerfile
    dockerContext: ./services/account-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-account-db
          property: connectionString
      - key: IDENTITY_SERVICE_URL
        value: https://banklite-identity-service.onrender.com
      - key: ENABLE_CONSUMER
        value: "false"

  - type: web
    name: banklite-ledger-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/ledger-service/Dockerfile
    dockerContext: ./services/ledger-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-ledger-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        value: https://banklite-account-service.onrender.com

  - type: web
    name: banklite-transfer-service
    runtime: docker
    plan: free
    dockerfilePath: ./services/transfer-service/Dockerfile
    dockerContext: ./services/transfer-service
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-transfer-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        value: https://banklite-account-service.onrender.com
      - key: LEDGER_SERVICE_URL
        value: https://banklite-ledger-service.onrender.com
      - key: ENABLE_EVENTS
        value: "false"
