databases:
  - name: banklite-identity-db
    databaseName: identity_db
    user: banklite
    plan: free

  - name: banklite-account-db
    databaseName: account_db
    user: banklite
    plan: free

  - name: banklite-ledger-db
    databaseName: ledger_db
    user: banklite
    plan: free

  - name: banklite-transfer-db
    databaseName: transfer_db
    user: banklite
    plan: free

services:
  - type: web
    name: banklite-identity-service
    runtime: python
    rootDir: services/identity-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-identity-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: EVENTS_EXCHANGE
        value: banklite.events
      - key: ENABLE_EVENTS
        value: "true"
      - key: PORT
        value: "10000"

  - type: web
    name: banklite-account-service
    runtime: python
    rootDir: services/account-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-account-db
          property: connectionString
      - key: IDENTITY_SERVICE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: EVENTS_EXCHANGE
        value: banklite.events
      - key: EVENTS_QUEUE
        value: account.events
      - key: ENABLE_CONSUMER
        value: "true"
      - key: PORT
        value: "10000"

  - type: web
    name: banklite-ledger-service
    runtime: python
    rootDir: services/ledger-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-ledger-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        sync: false
      - key: PORT
        value: "10000"

  - type: web
    name: banklite-transfer-service
    runtime: python
    rootDir: services/transfer-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-transfer-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        sync: false
      - key: LEDGER_SERVICE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: EVENTS_EXCHANGE
        value: banklite.events
      - key: ENABLE_EVENTS
        value: "true"
      - key: PORT
        value: "10000"
