databases:
  - name: banklite-db
    databaseName: banklite_db
    user: banklite
    plan: free

services:
  - type: web
    name: banklite-identity-service
    runtime: python
    rootDir: services/identity-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: RABBITMQ_URL
        value: amqps://qcvrxhkt:Ho-peGgxJcI0UiS1vEXAcXelEu6mLlew@fuji.lmq.cloudamqp.com/qcvrxhkt
      - key: EVENTS_EXCHANGE
        value: banklite.events
      - key: ENABLE_EVENTS
        value: "true"
      - key: PORT
        value: "10000"

  - type: web
    name: banklite-account-service
    runtime: python
    rootDir: services/account-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: IDENTITY_SERVICE_URL
        value: https://banklite-identity-service.onrender.com
      - key: RABBITMQ_URL
        value: amqps://qcvrxhkt:Ho-peGgxJcI0UiS1vEXAcXelEu6mLlew@fuji.lmq.cloudamqp.com/qcvrxhkt
      - key: EVENTS_EXCHANGE
        value: banklite.events
      - key: EVENTS_QUEUE
        value: account.events
      - key: ENABLE_CONSUMER
        value: "true"
      - key: PORT
        value: "10000"

  - type: web
    name: banklite-ledger-service
    runtime: python
    rootDir: services/ledger-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        value: https://banklite-account-service.onrender.com
      - key: PORT
        value: "10000"

  - type: web
    name: banklite-transfer-service
    runtime: python
    rootDir: services/transfer-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banklite-db
          property: connectionString
      - key: ACCOUNT_SERVICE_URL
        value: https://banklite-account-service.onrender.com
      - key: LEDGER_SERVICE_URL
        value: https://banklite-ledger-service.onrender.com
      - key: RABBITMQ_URL
        value: amqps://qcvrxhkt:Ho-peGgxJcI0UiS1vEXAcXelEu6mLlew@fuji.lmq.cloudamqp.com/qcvrxhkt
      - key: EVENTS_EXCHANGE
        value: banklite.events
      - key: ENABLE_EVENTS
        value: "true"
      - key: PORT
        value: "10000"
