services:
  identity-db:
    image: postgres:16-alpine
    container_name: banklite-identity-db
    environment:
      POSTGRES_USER: banklite
      POSTGRES_PASSWORD: banklite
      POSTGRES_DB: identity_db
    ports:
      - "5433:5432"
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banklite -d identity_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  account-db:
    image: postgres:16-alpine
    container_name: banklite-account-db
    environment:
      POSTGRES_USER: banklite
      POSTGRES_PASSWORD: banklite
      POSTGRES_DB: account_db
    ports:
      - "5434:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banklite -d account_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: banklite-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: banklite
      RABBITMQ_DEFAULT_PASS: banklite
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    build: ./services/identity-service
    container_name: banklite-identity-service
    environment:
      DATABASE_URL: postgresql+psycopg2://banklite:banklite@identity-db:5432/identity_db
      RABBITMQ_URL: amqp://banklite:banklite@rabbitmq:5672/
      EVENTS_EXCHANGE: banklite.events
      ENABLE_EVENTS: "true"
    ports:
      - "8001:8001"
    depends_on:
      identity-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  account-service:
    build: ./services/account-service
    container_name: banklite-account-service
    environment:
      DATABASE_URL: postgresql+psycopg2://banklite:banklite@account-db:5432/account_db
      IDENTITY_SERVICE_URL: http://identity-service:8001
      RABBITMQ_URL: amqp://banklite:banklite@rabbitmq:5672/
      EVENTS_EXCHANGE: banklite.events
      EVENTS_QUEUE: account.events
      ENABLE_CONSUMER: "true"
    ports:
      - "8002:8002"
    depends_on:
      account-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_started

  ledger-db:
    image: postgres:16-alpine
    container_name: banklite-ledger-db
    environment:
      POSTGRES_USER: banklite
      POSTGRES_PASSWORD: banklite
      POSTGRES_DB: ledger_db
    ports:
      - "5435:5432"
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banklite -d ledger_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  transfer-db:
    image: postgres:16-alpine
    container_name: banklite-transfer-db
    environment:
      POSTGRES_USER: banklite
      POSTGRES_PASSWORD: banklite
      POSTGRES_DB: transfer_db
    ports:
      - "5436:5432"
    volumes:
      - transfer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banklite -d transfer_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  ledger-service:
    build: ./services/ledger-service
    container_name: banklite-ledger-service
    environment:
      DATABASE_URL: postgresql+psycopg2://banklite:banklite@ledger-db:5432/ledger_db
      ACCOUNT_SERVICE_URL: http://account-service:8002
    ports:
      - "8003:8003"
    depends_on:
      ledger-db:
        condition: service_healthy
      account-service:
        condition: service_started

  transfer-service:
    build: ./services/transfer-service
    container_name: banklite-transfer-service
    environment:
      DATABASE_URL: postgresql+psycopg2://banklite:banklite@transfer-db:5432/transfer_db
      ACCOUNT_SERVICE_URL: http://account-service:8002
      LEDGER_SERVICE_URL: http://ledger-service:8003
      RABBITMQ_URL: amqp://banklite:banklite@rabbitmq:5672/
      EVENTS_EXCHANGE: banklite.events
      ENABLE_EVENTS: "true"
    ports:
      - "8004:8004"
    depends_on:
      transfer-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started

  web-panel:
    build:
      context: ./services/web-panel
      args:
        # El navegador del usuario corre FUERA de la red de Docker, por eso
        # aqui se usa localhost y los puertos publicados, no los nombres
        # internos de los contenedores (identity-service, account-service).
        NEXT_PUBLIC_IDENTITY_API_URL: http://localhost:8001
        NEXT_PUBLIC_ACCOUNT_API_URL: http://localhost:8002
        NEXT_PUBLIC_LEDGER_API_URL: http://localhost:8003
        NEXT_PUBLIC_TRANSFER_API_URL: http://localhost:8004
    container_name: banklite-web-panel
    ports:
      - "3000:3000"
    depends_on:
      - identity-service
      - account-service

volumes:
  identity-db-data:
  account-db-data:
  ledger-db-data:
  transfer-db-data:
